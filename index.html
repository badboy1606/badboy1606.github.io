<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ whoami</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    width: 100vw;
    font-family: "Courier New", monospace;
    background: url("background.jpg") no-repeat center center/cover;
    position: relative;
}

/* Dark overlay */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(3px);
    z-index: 0;
}

/* Terminal */
.terminal {
    position: absolute;
    top: 0;
    right: 0;
    width: 55%;
    height: 100vh;

    background: rgba(0, 0, 0, 0.95);
    border-left: 2px solid #ffd700; /* ONLY border yellow */

    z-index: 1;
    padding: 20px;
    overflow-y: auto;
}

/* Default text */
#terminalBody {
    color: #cccccc;
}

/* Prompt */
.prompt {
    color: #4fc3f7; /* cyan */
}

/* Command typed */
.command-text {
    color: #ffffff; /* white */
}

/* Output */
.output-text {
    color: #00ff99; /* soft green */
}

/* Input */
input {
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    width: 80%;
}

/* Links */
a {
    color: #ffcc00;
    text-decoration: none;
}

a:hover {
    text-shadow: 0 0 8px #ffcc00;
}
</style>
</head>

<body>

<div class="terminal">

    <div id="terminalBody">
        Type <span style="color:#ffcc00;">help</span> to see available commands.
        <br><br>
    </div>

    <div>
        <span class="prompt">arhan@portfolio:~$ </span>
        <input type="text" id="commandInput" autofocus>
    </div>

</div>

<script>
const input = document.getElementById("commandInput");
const terminalBody = document.getElementById("terminalBody");

const commands = {
    help: `
Available commands:
whoami
philosophy
interests
projects
clear
cd projects
    `,

    whoami: "Arhan | Electronics & Telecommunication | 2028",

    philosophy: `"If you don't sacrifice for what you want, what you want becomes the sacrifice."
Build. Break. Learn. Repeat.`,

    interests: `
reinforcement-learning
opencv
pcb-design
open-source
    `,

    projects: `
rubiks_solver
prosthetic_hand
(Type: cd projects to open full page)
    `
};

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const command = input.value.trim();

        terminalBody.innerHTML += `
        <div>
            <span class="prompt">arhan@portfolio:~$ </span>
            <span class="command-text">${command}</span>
        </div>
        `;

        executeCommand(command);

        input.value = "";
        window.scrollTo(0, document.body.scrollHeight);
    }
});

function executeCommand(command) {
    if (command === "clear") {
        terminalBody.innerHTML = "";
        return;
    }

    if (command === "cd projects") {
        terminalBody.innerHTML += `
        <div class="output-text">Opening projects...</div><br>
        `;
        setTimeout(() => {
            window.location.href = "projects.html";
        }, 800);
        return;
    }

    if (commands[command]) {
        terminalBody.innerHTML += `
        <div class="output-text" style="margin-left:20px;">
            ${commands[command]}
        </div><br>
        `;
    } else {
        terminalBody.innerHTML += `
        <div class="output-text" style="margin-left:20px;">
            Command not found. Type 'help'.
        </div><br>
        `;
    }
}
</script>

</body>
</html>
